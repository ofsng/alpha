<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alpha Beta Gama - Think Tank</title>
    <!-- Modern Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Marked.js for Markdown parsing -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

    <div class="container">
        <!-- KENAR BLOK (SIDEBAR) -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Antigravity Think Tank</h2>
                <p>AI'lar sizin yerinize tartışsın ve nihai çözümü bulsun.</p>
            </div>

            <div class="form-group">
                <label for="idea">Probleminizi veya Fikrinizi Yazın:</label>
                <textarea id="idea" rows="4" placeholder="Örn: Yapay zeka tabanlı bir hukuk asistanı oluşturmak istiyorum..."></textarea>
            </div>

            <div class="form-group">
                <label for="modelSelect">Kullanılacak Model:</label>
                <select id="modelSelect">
                    <option value="gemini-2.5-pro">Gemini 2.5 Pro</option>
                    <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
                    <option value="glm-4.7-flash" selected>GLM 4.7 Flash</option>
                </select>
            </div>

            <div class="form-group">
                <label for="loopCount">Maksimum Döngü (Alpha-Beta Turu):</label>
                <input type="number" id="loopCount" value="5" min="1" max="20">
            </div>

            <button id="startBtn" class="primary-btn">Tartışmayı Başlat</button>

            <div class="status-indicator" id="statusIndicator">
                <span class="dot"></span>
                <span id="statusText">Bekleniyor...</span>
            </div>
        </aside>

        <!-- ANA EKRAN (MAIN CHAT AREA) -->
        <main class="chat-area" id="chatArea">
            <div class="placeholder-message" id="placeholderMessage">
                <h1>Düz Sade Beyaz Alan</h1>
                <p>Ajanların tartışmasını başlatmak için sol taraftaki formu kullanın.</p>
            </div>
            
            <div class="messages" id="messagesContainer">
                <!-- Javascript will inject messages here -->
            </div>
        </main>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
